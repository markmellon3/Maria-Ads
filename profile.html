<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Maria Ads</title>
    <!-- CSS Imports (Same as Dashboard) -->
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/typography.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/sidebar.css">
    <link rel="stylesheet" href="assets/css/navbar.css">
    <link rel="stylesheet" href="assets/css/cards.css">
    <link rel="stylesheet" href="assets/css/buttons.css">
    <link rel="stylesheet" href="assets/css/forms.css">
    <link rel="stylesheet" href="assets/css/tables.css">
    <link rel="stylesheet" href="assets/css/modal.css">
    <link rel="stylesheet" href="assets/css/notifications.css">
    <link rel="stylesheet" href="assets/css/dashboard.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="dashboard-body">
    <div class="sidebar" id="sidebar">
        <!-- Sidebar content identical to dashboard.html -->
        <div class="sidebar-header"><a href="dashboard.html" class="brand-logo">Maria Ads</a></div>
        <nav class="sidebar-nav">
            <ul>
                <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
                <li><a href="campaigns.html" class="nav-link">Campaigns</a></li>
                <li><a href="create-ad.html" class="nav-link">Create Ad</a></li>
                <li><a href="analytics.html" class="nav-link">Analytics</a></li>
                <li><a href="wallet.html" class="nav-link">Wallet</a></li>
                <li><a href="websites.html" class="nav-link">Websites</a></li>
                <li><a href="profile.html" class="nav-link active">Profile</a></li>
                <li><a href="settings.html" class="nav-link">Settings</a></li>
                <li><a href="help.html" class="nav-link">Help</a></li>
                <li><button id="logout-btn" class="nav-link logout-btn">Logout</button></li>
            </ul>
        </nav>
    </div>

    <div class="main-content">
        <header class="navbar">
            <button class="menu-toggle" id="menu-toggle">☰</button>
            <div class="navbar-profile">
                <span class="user-name" id="nav-username">Loading...</span>
                <a href="profile.html" class="profile-icon">U</a>
            </div>
        </header>

        <main class="dashboard-content">
            <h1>Profile Settings</h1>
            <div class="card">
                <form id="profile-form">
                    <div class="form-group">
                        <label>Account ID</label>
                        <input type="text" id="profile-uid" readonly disabled>
                    </div>
                    <div class="form-group">
                        <label for="profile-name">Full Name</label>
                        <input type="text" id="profile-name" required>
                    </div>
                    <div class="form-group">
                        <label for="profile-email">Email</label>
                        <input type="email" id="profile-email" required>
                    </div>
                    <div class="form-group">
                        <label>Account Status</label>
                        <input type="text" id="profile-status" readonly disabled>
                    </div>
                    <div class="form-group">
                        <label>Creation Date</label>
                        <input type="text" id="profile-created" readonly disabled>
                    </div>
                    <button type="submit" class="btn btn-primary">Update Profile</button>
                </form>
            </div>
        </main>
    </div>

    <div id="notification-container"></div>
    <div id="modal-container"></div>

    <!-- JS Imports -->
    <script type="module" src="assets/js/firebase.js"></script>
    <script type="module" src="assets/js/helpers.js"></script>
    <script type="module" src="assets/js/notifications.js"></script>
    <script type="module" src="assets/js/modal.js"></script>
    <script type="module" src="assets/js/auth.js"></script>
    <script type="module" src="assets/js/auth-guard.js"></script>
    <script type="module" src="assets/js/navigation.js"></script>
    <script type="module" src="assets/js/profile.js"></script>
</body>
</html>
